services:
  postgres:
    image: postgres:18.4
    container_name: inventory-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    image: migrate/migrate:latest
    container_name: inventory-migrator
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://user:password@postgres:5432/db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data: